intro: I develop computational methods and tools that connect material behavior, physical interaction, and architectural
  design. My research combines programmable fabrication and design interfaces, with an emerging investigation into
  spatial archives and urban memory.
bio: 'Teng Teng is a tenure-track Assistant Professor of Architecture at Lawrence Technological University. He develops
  computational methods and tools that connect material behavior, physical interaction, and architectural design.


  His research makes material composition and distribution available as design variables through programmable fabrication.
  Active-mixing extrusion, computational toolpaths, and physical testing connect intended material arrangements
  to the structural and thermal behavior of architectural components. His work on gesture-based modeling and personal
  robotic fabrication examines how designers operate between digital geometry and physical prototypes.


  At LTU, he teaches integrated design studios, structural systems, and design-build. His teaching connects computational
  reasoning with material experiments, construction decisions, and critical examination of design tools. He co-led
  the 2026 TRI-ARC studio with Lee-Su Huang and Ryan Kahen, bringing remote design coordination into an on-site
  build.


  With Zhen Cheng, he is developing After Chinatown, a study of Chinese American urban memory in Detroit through
  archival research, interactive mapping, and historical reconstruction. Teng leads computational and spatial methods
  and platform development; Cheng leads archival research and humanistic interpretation. The project is an ongoing
  investigation into how spatial models represent historical evidence, change, and uncertainty.


  He received his Ph.D. in Architecture from the University of Pennsylvania in 2026, following graduate study at
  Cornell University and the University of Washington. His research and teaching appointments have included Penn’s
  Polyhedral Structures Laboratory, Cornell’s Jenny Sabin Lab, and the Shanghai Institute of Visual Art. His professional
  work includes computational design and project delivery at Callison and CallisonRTKL.'
