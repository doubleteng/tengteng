<link rel="stylesheet" href="{{ '/assets/ribo-viewer/viewers.css' | relative_url }}">
<section class="ribo-viewers" aria-label="Interactive architectural models">
  <section class="ribo-card" data-model="building" aria-label="Building model">
    <header><h2>Building model</h2><button type="button" data-expand aria-label="Expand building model" title="Expand view">⛶</button></header>
    <div class="ribo-stage" aria-label="Perspective view of the clubhouse"><img class="ribo-poster" src="{{ '/assets/ribo-viewer/building.webp' | relative_url }}" alt="Perspective of the clubhouse, courtyard and campus buildings" loading="lazy"><span class="ribo-status" role="status">Loading building model…</span></div>
    <div class="ribo-tools" aria-label="Building model controls">
      <button type="button" data-layers aria-expanded="false" aria-controls="ribo-layers">Layers</button>
      <button type="button" data-steel aria-pressed="false" title="Isolate steel framing, interior and exterior soffits, glazing channels and mullions">Steel, soffits &amp; mullions</button>
      <button type="button" data-cut="plan" aria-pressed="false">Plan cut</button>
      <button type="button" data-cut="section" aria-pressed="false">Section cut</button>
      <button type="button" data-reset title="Restore the initial camera, visibility and clipping">Reset</button>
    </div>
    <div class="ribo-cuts">
      <label hidden data-slider="plan">Plan height <input type="range" min="-1.4" max="11.2" value="3" step=".05"><output>3.00 m</output></label>
      <label hidden data-slider="section">Section X <input type="range" min="-14.6" max="11.0" value="0" step=".05"><output>0.00 m</output></label>
    </div>
    <div class="ribo-layers" id="ribo-layers" hidden><div class="ribo-panel-title"><strong>Model layers</strong><button type="button" data-close aria-label="Close layer selection">×</button></div><div data-layer-list></div></div>
  </section>
  <section class="ribo-card" data-model="detail" aria-label="Envelope detail">
    <header><h2>Envelope detail</h2><button type="button" data-expand aria-label="Expand envelope detail" title="Expand view">⛶</button></header>
    <div class="ribo-stage" aria-label="Perspective view of the roof and floor edge assembly"><img class="ribo-poster" src="{{ '/assets/ribo-viewer/detail.webp' | relative_url }}" alt="Sectional assembly of the glazed facade at the roof and floor" loading="lazy"><span class="ribo-status" role="status">Loading detail…</span></div>
    <div class="ribo-tools" aria-label="Detail viewpoints"><button type="button" data-focus="full" aria-pressed="true">Full</button><button type="button" data-focus="head" aria-pressed="false">Head</button><button type="button" data-focus="sill" aria-pressed="false">Sill</button></div>
  </section>
</section>
<script type="module" src="{{ '/assets/ribo-viewer/viewers.js' | relative_url }}"></script>
