intro: I develop computational methods and tools that connect material behavior,
  physical interaction, and architectural design. My research combines
  programmable fabrication and design interfaces, with an emerging investigation
  into spatial archives and urban memory.
bio: >-
  Teng Teng, PhD, is an Assistant Professor of Architecture at Lawrence
  Technological University. An interdisciplinary researcher and architect with
  international experience, his work focuses on materializing high-performance
  building systems by integrating novel construction materials with advanced
  fabrication technologies, robotics, and computational design to address
  environmental challenges. His research spans additive manufacturing,
  mechatronics, material systems, computational design, and intelligent
  approaches to design materialization.


  He has contributed to multiple NSF- and DOE-sponsored research projects, with
  publications in peer-reviewed journals including *Materials & Design*,
  *Advanced Functional Materials*, *Additive Manufacturing*, and *Building and
  Environment*. His work has also been presented at major conferences including
  ACADIA, eCAADe, and CAADRIA.


  Teng holds a PhD in Architecture and Building Technology from the University
  of Pennsylvania and master’s degrees from Cornell University and the
  University of Washington. He has taught and collaborated across these
  institutions and universities in Asia, leading courses and workshops in design
  computation, engineering, robotics, materials, and advanced digital
  fabrication methods. He serves on the Board of Directors of ACADIA and as an
  Early Career Editorial Board Member of *Architectural Intelligence*, published
  by Springer Nature.
