learning_process: A useful design review connects a claim to a drawing, model, or test that can be examined. In
  studio, students bring working models and digital iterations to discuss structural and construction decisions.
  In computational workshops, they compare input rules with generated and fabricated results. My teaching approach
  uses staged tasks and visible feedback to help students explain both how an outcome was produced and why they
  chose it.
proposed_intro: These course proposals extend my teaching in computation, physical prototyping, and architectural
  integration. They describe future offerings, not previously taught courses.
proposed_courses:
- title: Introduction to Architectural Computation
  level: Undergraduate lecture + lab
  description: A foundation in representation, rules, data, and geometric transformation, pairing short lectures
    with guided exercises. Students compare manual and computational descriptions of the same design problem.
  assignment: Develop a rule-based system for a structural bay or facade, then document how changing its assumptions
    changes the alternatives it produces.
  assessment: Clarity of representation, explanation of rules, controlled comparisons, and the ability to revise
    a model after feedback.
- title: Interfaces, Agency, and Design
  level: Graduate seminar + workshop
  description: A study of how interfaces, automation, and generated media distribute decisions between designers
    and computational systems. Readings and small prototypes connect technical operations to authorship and interpretation.
  assignment: Construct or modify a design interface and trace one task through its inputs, transformations, user
    interventions, and outputs.
  assessment: A documented interaction study and a critical account of the decisions the interface exposes, constrains,
    or conceals.
- title: Material Computation Studio
  level: Advanced design studio
  description: Design an architectural component through coordinated geometry, material distribution, and fabrication.
    Students use physical evidence to relate local material decisions to assembly behavior.
  assignment: Develop a component, test a material or connection hypothesis, and revise the assembly using the observed
    results.
  assessment: The relationship between design intent, manufacturing constraints, test evidence, and architectural
    resolution.
