name: Teng Teng
description: Architectural computation and design methods. Material systems, design interfaces, robotic tools, teaching,
  and spatial history by Teng Teng.
home_title: Architectural Computation & Design Methods
home_intro: I develop computational methods and tools that connect material behavior, physical interaction, and
  architectural design. My research combines programmable fabrication and design interfaces, with an emerging investigation
  into spatial archives and urban memory.
research_intro: 'I study how computational representations become design decisions: how a material map becomes a
  printed component, a gesture becomes geometry, and an archival record becomes a place in a digital model. Prototypes
  and experiments test what these translations make possible and where their limits remain.'
teaching_intro: I teach students to construct, test, and question the methods they use to design. Computational
  exercises, physical models, and collaborative building connect decisions about geometry and materials to their
  architectural and human consequences.
design_intro: My design practice connects computational tools to architectural coordination, fabrication, and construction.
  Built work and design studies span buildings, public spaces, products, and physical interfaces.
contact_intro: For research collaborations, teaching invitations, lectures, and design inquiries, please get in
  touch by email.
