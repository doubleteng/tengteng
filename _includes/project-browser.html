<section class="project-browser" data-browser>
<div class="browse-tools"><label class="search-field"><span>Search projects</span><input type="search" data-search-input placeholder="Title, material, method, or year…" autocomplete="off"></label>{% if include.all %}<div class="filter-group" aria-label="Filter projects"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="research" aria-pressed="false">Research</button><button type="button" data-filter="teaching" aria-pressed="false">Teaching</button><button type="button" data-filter="design" aria-pressed="false">Design</button></div>{% endif %}</div>
<p class="result-count" data-result-count aria-live="polite">{{ include.projects.size }} projects</p><div class="project-grid">{% for project in include.projects %}{% include project-card.html project=project %}{% endfor %}</div><p class="empty-state" data-empty hidden>No projects match your search. Try another term or choose a different category.</p></section>
