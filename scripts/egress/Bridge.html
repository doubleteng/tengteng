<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="font:15px/1.6 Arial;padding:24px;color:#254c3d"><h2>Egress + Site Lab</h2><p id="status">Shared plan recognition. No student account or API key is required.</p><p><a href="https://teng-teng.org/teaching/egress/">Open the design lab</a></p><script>
const nonce=<?!= JSON.stringify(nonce) ?>,origin=<?!= JSON.stringify(origin) ?>,token=<?!= JSON.stringify(token) ?>;
let peer=null;
window.addEventListener('message',function(e){
 const m=e.data;if(e.origin!==origin||!nonce||!m||m.nonce!==nonce)return;
 if(m.type==='egress-vision-hello'){
  if(peer&&peer!==e.source)return;peer=e.source;
  peer.postMessage({type:'egress-vision-ready',nonce},origin);
  document.getElementById('status').textContent='Recognition is ready in your design page.';return;
 }
 if(!peer||e.source!==peer||m.type!=='egress-vision-request')return;
 const request=m.request||{},requestId=m.requestId;
 if(!['status','recognizePlan'].includes(request.action))return;
 google.script.run.withSuccessHandler(function(result){peer.postMessage({type:'egress-vision-result',nonce,requestId,result},origin);})
 .withFailureHandler(function(error){peer.postMessage({type:'egress-vision-result',nonce,requestId,error:error.message||'Recognition is unavailable. Please try again shortly.'},origin);})
 .visionCall({action:request.action,image:request.image,token});
});
</script></body></html>
