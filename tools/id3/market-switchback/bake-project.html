<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Crossing lighting bake</title>
<style>
body{font:100%/1.6 system-ui,sans-serif;max-width:48rem;margin:6vh auto;padding:0 5vw;color:#243e40;background:#f9faf4}
h1{font-size:1.75rem}button,a{font:inherit}button{padding:.5em 1em}progress{display:block;width:100%;height:1rem;margin:.7em 0}
output{display:block;font-variant-numeric:tabular-nums}a[hidden]{display:none}code{overflow-wrap:anywhere}
</style>
<main><h1>Market Crossing lighting bake</h1><p>Generate the gallery’s diffuse-light field from the registered case model. Download the result for publication beside the model.</p>
<button type="button" id="start">Bake lighting</button><progress value="0" max="1" id="progress"></progress>
<output id="status" role="status" aria-live="polite">Ready</output>
<p><a id="save" hidden download="market-switchback.light.gz">Download the lighting field</a></p>
</main>
<script type="module">
const params=new URLSearchParams(location.search);
const base=new URL('../../../teaching/id3/models/market-switchback.glb',location.href);
if(params.has('model')){
 const requested=new URL(params.get('model'),location.href);
 if(requested.origin===location.origin)base.href=requested.href;
}
const button=document.getElementById('start'),status=document.getElementById('status');
const progress=document.getElementById('progress'),save=document.getElementById('save');
let local;
button.onclick=async()=>{
 button.disabled=true;save.hidden=true;progress.value=0;
 if(local)URL.revokeObjectURL(local);
 let worker;
 const failed=error=>{status.textContent='Bake failed. '+error;button.disabled=false;worker?.terminate()};
 try{
  status.textContent='Loading the registered model…';
  const response=await fetch(base);if(!response.ok)throw Error('Model HTTP '+response.status);
  const buffer=await response.arrayBuffer();
  worker=new Worker('./bake-project-worker.mjs',{type:'module'});
  worker.onerror=event=>failed(event.message);
  worker.onmessage=async({data})=>{
   if(data.error){failed(data.error);return;}
   if(data.stage){
    const part=data.stage==='Sky visibility'?.12*data.done/data.total:.12+.88*data.done/data.total;
    progress.value=part;status.textContent=data.stage+' · '+Math.round(100*part)+'%';return;
   }
   const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data.compressed)),b=>b.toString(16).padStart(2,'0')).join('');
   status.textContent='Finished in '+data.seconds.toFixed(1)+' s. '+data.triangles.toLocaleString()+' opaque triangles. '+data.size.join(' × ')+' probes. '+data.compressed.byteLength.toLocaleString()+' bytes. SHA-256 '+sha;
   local=URL.createObjectURL(new Blob([data.compressed],{type:'application/gzip'}));
   save.href=local;save.hidden=false;progress.value=1;button.disabled=false;worker.terminate();
  };
  worker.postMessage({buffer},[buffer]);
 }catch(error){failed(error.message);}
};
</script></html>
