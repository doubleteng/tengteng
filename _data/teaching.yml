principles:
- title: Make rules explicit
  text: Translate a design intention into geometric rules, material variables, or a sequence of operations. Compare
    alternatives by changing a stated assumption.
- title: Learn through feedback
  text: Use physical models, fabrication trials, and technical drawings to test a proposal. Connect each revision
    to an observed behavior or a construction constraint.
- title: Question the tool
  text: Examine which decisions a tool automates and which remain open to its users. Trace how an interface, generated
    image, or shared model shapes the work students produce.
