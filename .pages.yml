- name: chinese
  label: 中文
  type: group
  items:
  - name: editor-guide
    label: 使用教程
    type: file
    path: docs/EDITOR_GUIDE.md
    format: yaml-frontmatter
    fields:
    - name: body
      label: false
      type: rich-text
      readonly: true
      options:
        format: markdown
    operations:
      delete: false
      rename: false
  - name: projects
    label: 作品管理
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: 作品名称
      type: string
      required: true
    - &id004
      name: published
      label: 发布到网站
      type: boolean
      description: 关闭时保存为草稿；开启并保存后，网站会自动更新。公开仓库中的草稿仍可在 GitHub 中查看。
      default: false
    - name: category
      label: 作品分类
      type: select
      options:
        values:
        - name: research
          label: 研究 Research
        - name: teaching
          label: 教学 Teaching
        - name: design
          label: 设计 Design
      required: true
    - name: year
      label: 年份或年份范围
      type: string
      required: false
      description: 例如 2026 或 2024–2026。
    - name: summary
      label: 一句话简介
      type: text
      required: true
      description: 用于首页、目录卡片和详情页顶部。简要说明项目做了什么、有什么特点。
    - name: cover
      label: 封面图
      type: image
      options:
        media: images
      description: 建议横向图片。没有封面时显示作品标题。
    - name: cover_caption
      label: Cover caption / 封面图注
      type: text
    - name: cover_alt
      label: 封面图片描述
      type: string
    - name: featured
      label: 显示在首页精选
      type: boolean
      default: false
    - name: featured_order
      label: 首页排序
      type: number
      description: 数字越小越靠前；建议 1、2、3……
      default: 99
    - name: project_type
      label: 项目类型
      type: string
      description: 例如 Architecture、Workshop、Fabrication system。
    - name: project_stage
      label: 项目阶段
      type: string
      description: 例如 Built、Schematic design、Research prototype。
    - name: role
      label: 我的职责
      type: string
      description: 多材料打印相关项目，或关联论文中为第一作者，填写 Leading Contributor（主导贡献者）；其他项目中为第二作者，填写 Major Contributor（主要贡献者）；其余项目保留具体职责。
    - name: institution
      label: 机构／实验室／公司
      type: string
    - name: location
      label: 地点
      type: string
    - name: tags
      label: 标签
      type: string
      list: true
      description: 每项一个标签，例如 robotic fabrication。用于搜索。
    - name: card_title
      label: 卡片短标题
      type: string
    - name: research_areas
      label: 研究方向
      type: string
      list: true
      description: 填写 material-computation、interfaces-and-tools 或 spatial-history；一个项目可属于多个方向。
    - name: research_order
      label: 研究方向内排序
      type: number
    - name: question_label
      label: 问题栏目标签
      type: string
    - name: research_question
      label: 研究或教学问题
      type: text
    - name: contribution
      label: 方法贡献概述
      type: text
    - name: method_steps
      label: 方法或建造步骤
      type: object
      list: true
      fields:
      - name: title
        label: 步骤标题
        type: string
      - name: text
        label: 步骤说明
        type: text
    - name: contributions
      label: 我的具体贡献
      type: text
      list: true
    - name: evidence_label
      label: 验证依据标题
      type: string
    - name: evidence
      label: 验证依据及适用范围
      type: text
    - name: related_projects
      label: 关联项目网址
      type: string
      list: true
    - name: primary_link
      label: 项目主要链接
      type: object
      fields:
      - name: title
        label: 链接文字
        type: string
      - name: url
        label: 网址
        type: string
    - name: body
      label: 项目正文
      type: rich-text
      options:
        format: markdown
        media: images
      description: 可直接排版。建议写：项目背景 → 我的职责 → 方法与过程 → 成果。可插入图文。
    - name: sections
      label: 图文内容区块
      type: block
      list: true
      blockKey: type
      description: 按顺序添加文字、单图、批量相册或视频；列表顺序就是网页顺序。
      blocks:
      - name: text
        label: 文字段落
        fields:
        - name: heading
          label: 小标题
          type: string
        - name: body
          label: 正文
          type: rich-text
          options:
            format: markdown
            media: images
      - name: image
        label: 单张图片（含署名）
        fields:
        - name: heading
          label: 小标题
          type: string
        - name: image
          label: 图片
          type: image
          options:
            media: images
          required: true
        - name: alt
          label: 图片描述
          type: string
          description: 简要描述图片内容，便于无障碍阅读。
        - name: caption
          label: 图片说明
          type: text
        - name: credit
          label: 摄影／图片署名
          type: string
      - name: gallery
        label: 批量图片相册
        fields:
        - name: heading
          label: 相册标题
          type: string
        - name: images
          label: 选择或上传多张图片
          type: image
          options:
            media: images
            multiple: true
          required: true
        - name: caption
          label: 相册说明
          type: text
        - name: columns
          label: 每行图片数量
          type: select
          options:
            values:
            - name: one
              label: 1 张
            - name: two
              label: 2 张
            - name: three
              label: 3 张
          default: two
      - name: video
        label: 视频
        fields:
        - name: heading
          label: 视频标题
          type: string
        - name: url
          label: YouTube、Vimeo 或 MP4/WebM 地址
          type: string
          description: 填写在线视频链接，或在下方选择、上传视频文件。
        - name: file
          label: 上传或选择视频
          type: file
          options:
            media: videos
          description: 选择文件后优先播放该文件。建议使用压缩后的 MP4。
        - name: poster
          label: 视频封面图
          type: image
          options:
            media: images
          description: 留空时使用作品封面。
        - name: caption
          label: 视频说明
          type: text
      - name: quote
        label: 引文
        fields:
        - name: text
          label: 引文内容
          type: text
          required: true
        - name: attribution
          label: 出处
          type: string
      - name: links
        label: 下载与外部链接
        fields:
        - name: heading
          label: 小标题
          type: string
        - name: items
          label: 链接
          type: object
          fields: &id001
          - &id002
            name: title
            label: 显示名称
            type: string
            required: true
          - &id003
            name: url
            label: 网址或文件路径
            type: string
            required: true
          list: true
    - name: credits
      label: 贡献与署名
      type: string
      description: 姓名直接填写普通文本即可。网站会自动将 Teng Teng 加粗，无需手动添加格式。
      list: true
    - name: team
      label: 团队成员
      type: string
      list: true
    - name: acknowledgements
      label: 致谢
      type: text
    - name: related_publications
      label: 相关论文
      type: object
      fields: *id001
      list: true
    - name: awards
      label: 奖项
      type: object
      fields: *id001
      list: true
    - name: links
      label: 相关链接与下载
      type: object
      fields:
      - *id002
      - *id003
      - name: kind
        label: 链接类型
        type: select
        options:
          values:
          - name: site
            label: 网站
          - name: paper
            label: 论文
          - name: video
            label: 视频
          - name: download
            label: 下载
      list: true
    - name: editor_notes
      label: 编辑备忘（不显示在网页）
      type: text
      description: 记录待补充内容。公开仓库可见，请勿写密码或私人信息。
    - name: source_links
      label: 资料来源（不显示在网页）
      type: string
      list: true
    view:
      primary: title
      fields:
      - title
      - published
      - year
      search:
      - title
      - summary
      - tags
      - editor_notes
      sort:
      - year
      - title
      - published
      default:
        sort: year
        order: desc
  - name: publications
    label: 论文与出版物
    type: collection
    path: _publications
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: 论文／出版物标题
      type: string
      required: true
    - *id004
    - name: kind
      label: 类型
      type: select
      options:
        values:
        - name: journal
          label: 期刊
        - name: conference
          label: 会议
        - name: book
          label: 书籍／章节
        - name: patent
          label: 专利
        - name: thesis
          label: 学位论文
        - name: other
          label: 其他
      required: true
    - name: year
      label: 年份
      type: number
      required: true
    - name: authors
      label: 作者（分号分隔）
      type: string
      required: true
    - name: venue
      label: 期刊／会议／学校
      type: string
    - name: status
      label: 状态
      type: select
      options:
        values:
        - name: published
          label: 已发表
        - name: in-press
          label: 待刊
        - name: pending
          label: 申请中／待确认
      default: published
    - name: featured
      label: 精选
      type: boolean
      default: false
    - name: url_link
      label: DOI／出版社链接
      type: string
    - name: pdf
      label: 上传论文 PDF
      type: file
      options:
        media: documents
    - name: note
      label: 补充说明
      type: text
    - name: body
      label: 摘要
      type: rich-text
      options:
        format: markdown
        media: images
    - name: bibtex
      label: BibTeX 引用
      type: text
      description: 可直接粘贴出版社提供的 BibTeX；留空则不显示引用按钮。
    view:
      primary: title
      fields:
      - title
      - published
      - year
      search:
      - title
      - authors
      - venue
      sort:
      - year
      - title
      - published
      default:
        sort: year
        order: desc
  - name: updates
