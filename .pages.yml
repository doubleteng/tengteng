media:
- name: images
  label: Images / 图片素材
  input: assets/media
  output: /assets/media
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
- name: documents
  label: Documents / PDF 与文件
  input: assets/documents
  output: /assets/documents
  rename: safe
  extensions:
  - pdf
  - zip
  - txt
- name: videos
  label: Videos / 视频
  input: assets/videos
  output: /assets/videos
  rename: safe
  extensions:
  - mp4
  - webm
content:
- name: english
  label: English
  type: group
  items:
  - name: editor-guide-en
    label: User guide
    type: file
    path: docs/EDITOR_GUIDE_EN.md
    format: yaml-frontmatter
    fields:
    - name: body
      label: false
      type: rich-text
      readonly: true
      options:
        format: markdown
    operations:
      delete: false
      rename: false
  - name: projects-en
    label: Projects
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: Project title
      type: string
      required: true
    - name: published
      label: Publish on website
      type: boolean
      description: Turn off to keep a draft. Turn on and save to publish. Draft source files remain visible in this
        public GitHub repository.
      default: false
    - name: category
      label: Category
      type: select
      options:
        values:
        - name: research
          label: Research
        - name: teaching
          label: Teaching
        - name: design
          label: Design
      required: true
    - name: year
      label: Year or period
      type: string
      required: false
      description: For example, 2026 or 2024–2026.
    - name: summary
      label: Short description
      type: text
      required: true
      description: Shown on the homepage, project cards, and project heading. State what the project does and what
        distinguishes it.
    - name: cover
      label: Cover image
      type: image
      options:
        media: images
      description: A landscape image works best. Without a cover, the card displays the project title.
    - name: cover_caption
      label: Cover caption / 封面图注
      type: text
    - name: cover_alt
      label: Cover image description
      type: string
    - name: featured
      label: Feature on homepage
      type: boolean
      default: false
    - name: featured_order
      label: Homepage order
      type: number
      description: 'Lower numbers appear first: 1, 2, 3, and so on.'
      default: 99
    - name: project_type
      label: Project type
      type: string
      description: For example, Architecture, Workshop, or Fabrication system.
    - name: project_stage
      label: Project stage
      type: string
      description: For example, Built, Schematic design, or Research prototype.
    - name: role
      label: My role
      type: string
      description: Use Leading Contributor for multimaterial printing or first authorship on a related publication;
        otherwise use Major Contributor for second authorship. Keep the specific role for other projects.
    - name: institution
      label: Institution, laboratory, or practice
      type: string
    - name: location
      label: Location
      type: string
    - name: tags
      label: Tags
      type: string
      list: true
      description: One tag per item, such as robotic fabrication. Tags are included in search.
    - name: card_title
      label: Short card title
      type: string
    - name: research_areas
      label: Research areas
      type: string
      list: true
      description: Use material-computation, interfaces-and-tools, or spatial-history. A project can appear in multiple
        areas.
    - name: research_order
      label: Order within research areas
      type: number
    - name: question_label
      label: Question label
      type: string
    - name: research_question
      label: Research or teaching question
      type: text
    - name: contribution
      label: Method contribution
      type: text
    - name: method_steps
      label: Method or construction sequence
      type: object
      list: true
      fields:
      - name: title
        label: Step title
        type: string
      - name: text
        label: Description
        type: text
    - name: contributions
      label: My specific contributions
      type: text
      list: true
    - name: evidence_label
      label: Evidence heading
      type: string
    - name: evidence
      label: Evidence and scope
      type: text
    - name: related_projects
      label: Connected project URLs
      type: string
      list: true
    - name: primary_link
      label: Primary project link
      type: object
      fields:
      - name: title
        label: Link label
        type: string
      - name: url
        label: URL
        type: string
    - name: body
      label: Project description
      type: rich-text
      options:
        format: markdown
        media: images
      description: Describe the project context, your contribution, methods, and results. You can insert text and
        images.
    - name: sections
      label: Content blocks
      type: block
      list: true
      blockKey: type
      description: Add text, individual images, galleries, or videos. Their list order is the order on the page.
      blocks:
      - name: text
        label: Text
        fields:
        - name: heading
          label: Heading
          type: string
        - name: body
          label: Body
          type: rich-text
          options:
            format: markdown
            media: images
      - name: image
        label: Image with credit
        fields:
        - name: heading
          label: Heading
          type: string
        - name: image
          label: Image
          type: image
          options:
            media: images
          required: true
        - name: alt
          label: Image description
          type: string
          description: Briefly describe the image for accessible reading.
        - name: caption
          label: Caption
          type: text
        - name: credit
          label: Image credit
          type: string
      - name: gallery
        label: Image gallery
        fields:
        - name: heading
          label: Gallery heading
          type: string
        - name: images
          label: Select or upload images
          type: image
          options:
            media: images
            multiple: true
          required: true
        - name: caption
          label: Gallery caption
          type: text
        - name: columns
          label: Images per row
          type: select
          options:
            values:
            - name: one
              label: One image
            - name: two
              label: Two images
            - name: three
              label: Three images
          default: two
      - name: video
        label: Video
        fields:
        - name: heading
          label: Video heading
          type: string
        - name: url
          label: YouTube, Vimeo, or MP4/WebM URL
          type: string
          description: Use a hosted video link, or select a video file below.
        - name: file
          label: Upload or select a video
          type: file
          options:
            media: videos
          description: An uploaded file takes priority over the URL above. Use a compressed MP4 for reliable playback.
        - name: poster
          label: Video cover image
          type: image
          options:
            media: images
          description: Uses the project cover when empty.
        - name: caption
          label: Video caption
          type: text
      - name: quote
        label: Quotation
        fields:
        - name: text
          label: Quote
          type: text
          required: true
        - name: attribution
          label: Attribution
          type: string
      - name: links
        label: Downloads and external links
        fields:
        - name: heading
          label: Heading
          type: string
        - name: items
          label: Link
          type: object
          fields:
          - name: title
            label: Display name
            type: string
            required: true
          - name: url
            label: URL or file path
            type: string
            required: true
          list: true
    - name: credits
      label: Contributions and credits
      type: string
      description: Enter names as plain text. Teng Teng is automatically displayed in bold on the website.
      list: true
    - name: team
      label: Team members
      type: string
      list: true
    - name: acknowledgements
      label: Acknowledgements
      type: text
    - name: related_publications
      label: Related publications
      type: object
      fields:
      - name: title
        label: Display name
        type: string
        required: true
      - name: url
        label: URL or file path
        type: string
        required: true
      list: true
    - name: awards
      label: Awards
      type: object
      fields:
      - name: title
        label: Display name
        type: string
        required: true
      - name: url
        label: URL or file path
        type: string
        required: true
      list: true
    - name: links
      label: Resources and downloads
      type: object
      fields:
      - name: title
        label: Display name
        type: string
        required: true
      - name: url
        label: URL or file path
        type: string
        required: true
      - name: kind
        label: Link type
        type: select
        options:
          values:
          - name: site
            label: Website
          - name: paper
            label: Paper
          - name: video
            label: Video
          - name: download
            label: Download
      list: true
    - name: editor_notes
      label: Editor notes (not shown on the website)
      type: text
      description: Track missing content. These notes are visible in the public repository; do not enter credentials
        or private information.
    - name: source_links
      label: Source references (not shown on the website)
      type: string
      list: true
    view:
      primary: title
      fields:
      - title
      - published
      - year
      search:
      - title
      - summary
      - tags
      - editor_notes
      sort:
      - year
      - title
      - published
      default:
        sort: year
        order: desc
