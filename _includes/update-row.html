<article class="news-row"><time datetime="{{ include.update.date | date_to_xmlschema }}">{{ include.update.date | date: '%b %d, %Y' }}</time><div><p class="eyebrow">{{ include.update.category | capitalize }}</p><h2><a href="{{ include.update.url | relative_url }}">{{ include.update.title | escape }}</a></h2><p>{{ include.update.summary | escape }}</p></div><a href="{{ include.update.url | relative_url }}" aria-label="Read {{ include.update.title | escape }}">↗</a></article>
