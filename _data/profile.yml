bio: 'Teng Teng, PhD, is an Assistant Professor of Architecture at Lawrence Technological University. His research develops
  materiality as an active dimension of computational design alongside morphology and topology. He investigates how material
  composition, spatial distribution, and transitions can tune structural and physical responses, generate form, and realize
  connections. Computational methods, fabrication systems, and physical experiments establish how these material decisions
  can be designed, manufactured, and verified.


  His architectural practice follows design decisions through facade development, construction documentation, and coordination
  with manufacturers and contractors. His teaching connects structural reasoning and building systems to computation
  and physical making. Related investigations in design interfaces and spatial history extend his work into physical
  interaction and urban memory.


  He has contributed to multiple NSF- and DOE-sponsored research projects, with publications in peer-reviewed journals
  including *Materials & Design*, *Advanced Functional Materials*, *Additive Manufacturing*, and *Building and Environment*.
  His work has also been presented at major conferences including ACADIA, eCAADe, and CAADRIA.


  Teng holds a PhD in Architecture and Building Technology from the University of Pennsylvania and master’s degrees from
  Cornell University and the University of Washington. He has taught and collaborated across these institutions and universities
  in Asia, leading courses and workshops in design computation, engineering, robotics, materials, and advanced digital
  fabrication methods. He serves on the Board of Directors of ACADIA and as an Early Career Editorial Board Member of
  *Architectural Intelligence*, published by Springer Nature.'
