name: Teng Teng
description: Architecture, materials, computation, and fabrication. Research, teaching, design, and publications
  by Teng Teng.
home_title: Architecture through materials, computation, and making.
home_intro: I work across materials, computation, and fabrication to develop high-performance architectural components
  and structural systems.
research_intro: My research connects material distribution, manufacturing control, and architectural performance.
  Projects range from programmable printing systems and robotic tools to material studies, structural components,
  and built prototypes.
teaching_intro: My teaching connects computational design, material behavior, structural reasoning, and physical
  making. Studios, seminars, and workshops bring design decisions into contact with fabrication processes and construction
  constraints.
design_intro: My design practice spans buildings, public spaces, products, and physical interfaces. Computational
  methods support the translation of design intent into material systems and coordinated construction.
contact_intro: For research collaborations, teaching invitations, lectures, and design inquiries, please get in
  touch by email.
