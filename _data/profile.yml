intro: I work across materials, computation, and fabrication to develop
  high-performance architectural components and structural systems.
bio: >-
  Teng Teng is a tenure-track Assistant Professor of Architecture at Lawrence
  Technological University. He holds a Ph.D. in Architecture from the University
  of Pennsylvania, an M.S. in Matter Design Computation from Cornell University,
  an M.S. in Architecture from the University of Washington, and a B.Arch from
  Shanghai University.


  His research links material development, computational design, and advanced
  manufacturing. His work includes single-nozzle multimaterial printing, robotic
  fabrication platforms, and structural and environmental applications of
  programmable material distribution.


  He has taught studios, seminars, and workshops at institutions including Penn,
  Cornell, the University of Washington, Tongji University, Shanghai University,
  and the Shanghai Institute of Visual Art. His professional experience spans
  architectural design, computational design, and project delivery across Asia,
  the Middle East, and North America.
