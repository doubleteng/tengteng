<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 阅览 · 滕白也档案</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="viewer.css">
</head><body><main class="pdf-reader"><header><a id="home" href="../index.html#archive">滕白也档案</a><span id="title">PDF</span><a id="download" download hidden>下载原件</a></header>
<div class="bar" aria-label="PDF 阅读工具"><button id="prev" type="button" aria-label="上一页">‹</button><label><span id="page-label">页</span> <input id="number" type="number" min="1" value="1" inputmode="numeric"></label><span>/ <b id="count">—</b></span><button id="next" type="button" aria-label="下一页">›</button><span class="spacer"></span><button id="minus" aria-label="缩小">−</button><button id="fit">适合宽度</button><button id="plus" aria-label="放大">＋</button></div>
<div id="viewport" tabindex="0" aria-label="PDF 页面"><p id="status" role="status">正在打开 PDF…</p><canvas id="paper" hidden></canvas></div>
<noscript>请启用 JavaScript 进行站内翻页。</noscript></main><script src="viewer.js" type="module"></script></body></html>
