principles:
- title: Design through structural reasoning
  text: Use structural bays, grids, material systems, and construction details to guide architectural decisions.
- title: Learn through making
  text: Develop working models and fabrication experiments to test spatial, material, and structural ideas.
- title: Connect scales and disciplines
  text: Relate computational tools and material experiments to assemblies, buildings, and collaborative practice.
