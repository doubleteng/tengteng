---
layout: default
---
{% comment %}Keep the workspace outside the CMS rich-text body so saving prose cannot strip its iframe.{% endcomment %}
<style>
.stresspath-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:18px 0 20px}
.stresspath-heading h1{margin:0}
.stresspath-frame{display:block;width:100%;height:90vh;height:90dvh;min-height:720px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.stresspath-description{max-width:1040px;margin:0 0 32px;line-height:1.7}
.stresspath-description h2{margin-top:26px;margin-bottom:12px}
.stresspath-description li{margin-bottom:12px}
@media(max-width:760px){.stresspath-heading{display:block}.stresspath-heading .button{display:inline-block;margin-top:14px}.stresspath-frame{min-height:720px}}
</style>
<div class="page-top"><a class="back-link" href="{{ '/research/' | relative_url }}">← Research</a><p class="eyebrow">{{ page.year | escape }}</p></div>
<header class="stresspath-heading">
  <h1>{{ page.title | escape }}</h1>
  <a class="button" href="{{ '/research/stresspath/app/' | relative_url }}?v=1.35" target="_blank" rel="noopener">Open full screen ↗</a>
</header>
<div class="stresspath-description">{{ content }}{% include research-publications.html %}</div>
<iframe class="stresspath-frame" src="{{ '/research/stresspath/app/' | relative_url }}?v=1.35" title="StressPath interactive workspace" loading="eager" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
