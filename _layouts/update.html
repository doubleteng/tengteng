---
layout: default
---
<a class="back-link" href="{{ '/news/' | relative_url }}">← News</a>
<header class="page-heading"><p class="eyebrow">{{ page.date | date: '%B %-d, %Y' }} · {{ page.category | capitalize }}</p><h1>{{ page.title | escape }}</h1><p class="lead">{{ page.summary | escape }}</p></header>
{% if page.image and page.image != '' %}<img class="update-image" src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">{% endif %}
<article class="prose reading-width">{{ content }}</article>
{% if page.link and page.link != '' %}<p><a class="text-link" href="{{ page.link | escape }}">Related resource →</a></p>{% endif %}
