footer_text: Architectural computation · Design methods · Research & teaching
home_research_title: Making design decisions available for testing.
home_research_text: My work connects the development of computational tools with their use in design. Material experiments
  test the consequences of programmed composition; interactive prototypes examine how designers manipulate geometry;
  architectural assemblies expose the constraints of fabrication and construction.
collaboration_intro: I welcome conversations with students and collaborators working on material computation, design
  interfaces, robotic fabrication, and spatial history.
