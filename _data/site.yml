name: Teng Teng
description: 'Computational design through materiality: material distribution, transitions, structural behavior, and
  architectural materialization. Research, teaching, and practice by Teng Teng.'
home_title: Computational Design through Materiality
home_intro: I investigate materiality as an active dimension of computational design alongside morphology and topology.
  Through material composition, spatial distribution, and transitions, I explore how material behavior can shape form,
  tune performance, and realize connections.
research_intro: 'My research develops materiality as an active dimension of computational design alongside morphology
  and topology. When materials are treated as fixed, homogeneous inputs, performance is adjusted primarily through geometry
  and connectivity. Making material composition, distribution, and transitions designable expands this space: material
  variation can tune responses within a given geometry, generate form through differential behavior, and physically realize
  connections between members. I develop computational methods, fabrication systems, and physical experiments to investigate
  these possibilities, connecting local material decisions to structural behavior and architectural construction.'
teaching_intro: My teaching connects decisions about geometry, materials, and construction to observable structural and
  physical behavior. Research-led studios and workshops test these relationships through computation and making; professional
  courses develop the structural reasoning and technical coordination needed for architectural practice.
design_intro: My architectural practice connects design intent to materialization through geometric development, facade
  systems, construction details, and coordination with manufacturers and contractors. Built work and design studies show
  how these responsibilities vary across buildings, public spaces, and objects.
contact_intro: For research collaborations, teaching invitations, lectures, and design inquiries, please get in touch
  by email.
